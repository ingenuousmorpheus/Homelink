<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#06070d">
    <title>HomeLink // LanaNet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #06070d;
            --panel: rgba(22, 15, 26, .55);
            --panel-solid: #100b16;
            --maroon: #5e1a2e;
            --gold: #ffc66b;
            --amber: #ffb000;
            --cyan: #5cc8ff;
            --red: #ff3b5c;
            --green: #7affb0;
            --text: #e7dcea;
            --dim: #9a7d86;
            --border: rgba(255, 184, 90, .16);
            --border-bright: rgba(255, 184, 90, .45);
        }
        html, body {
            height: 100%;
            background:
                radial-gradient(1100px 640px at 50% -10%, rgba(94,26,46,.45), transparent 60%),
                radial-gradient(800px 520px at 85% 110%, rgba(92,200,255,.07), transparent 55%),
                var(--bg);
            color: var(--text);
            font-family: 'Rajdhani', 'Segoe UI', system-ui, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .font-cyber { font-family: 'Orbitron', sans-serif; }
        .font-term  { font-family: 'Share Tech Mono', monospace; }
        .glow-gold  { text-shadow: 0 0 14px var(--gold); }
        .glow-cyan  { text-shadow: 0 0 12px var(--cyan); }
        .glow-red   { text-shadow: 0 0 10px var(--red); }
        .glow-green { text-shadow: 0 0 10px var(--green); }

        /* CRT scanlines laid over camera tiles */
        .scanlines { position: relative; }
        .scanlines::after {
            content: '';
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: repeating-linear-gradient(
                to bottom,
                rgba(0, 0, 0, 0) 0px,
                rgba(0, 0, 0, 0) 2px,
                rgba(0, 0, 0, .18) 3px
            );
            mix-blend-mode: multiply;
        }
        .crt-vignette::before {
            content: '';
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 1;
            box-shadow: inset 0 0 60px rgba(0,0,0,.75);
        }

        /* NO SIGNAL static */
        @keyframes tv-static {
            0%   { background-position: 0 0; }
            25%  { background-position: -160px 90px; }
            50%  { background-position: 120px -60px; }
            75%  { background-position: -70px -140px; }
            100% { background-position: 0 0; }
        }
        .tv-static {
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/><feColorMatrix type='saturate' values='0'/></filter><rect width='120' height='120' filter='url(%23n)' opacity='0.16'/></svg>");
            animation: tv-static .28s steps(4) infinite;
        }
        @keyframes flicker {
            0%, 92%, 100% { opacity: 1; }
            93%           { opacity: .35; }
            95%           { opacity: .85; }
            97%           { opacity: .45; }
        }
        .flicker { animation: flicker 3.5s infinite; }
        @keyframes rec-blink {
            0%, 60% { opacity: 1; }
            61%, 100% { opacity: .15; }
        }
        .rec-blink { animation: rec-blink 1.2s infinite; }

        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,184,90,.3); border-radius: 10px; }

        .message-bubble { max-width: 85%; word-wrap: break-word; }
        input, textarea { color: var(--text); }
        ::placeholder { color: var(--dim) !important; opacity: .7; }
    </style>
<script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3"
  }
}
</script>
</head>
<body>
    <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
